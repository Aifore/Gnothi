# 备用方案：如果 Gnothi.xcodeproj 打不开，可用 XcodeGen 重新生成
#   brew install xcodegen && xcodegen generate
name: Gnothi
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: zh-Hans
schemes:
  Gnothi:
    build:
      targets:
        Gnothi: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
targets:
  Gnothi:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Gnothi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.gnothi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Gnothi
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用 Face ID 保护你的心灵记录
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将报告图片保存到你的相册
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
